[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anni"
dynamic = ["version"]
description = "ANNI (Auditory Nerve Noticeability Index): how noticeable the difference between two audio signals is"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DeepMark Inc." }]
keywords = ["audio", "quality", "audibility", "auditory nerve", "neurogram", "psychoacoustics", "watermarking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]

# CPU and GPU both work; install the torch build for your CUDA version from https://pytorch.org if needed.
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "soxr>=0.3",
]

[project.urls]
Homepage = "https://github.com/deepmark/anni"
Issues = "https://github.com/deepmark/anni/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "anni.__version__" }
